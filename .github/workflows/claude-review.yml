name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Le PR da fork non hanno accesso ai secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Rivedi questa pull request seguendo le regole di CLAUDE.md.
            Verifica correttezza, test mancanti, sicurezza (auth, pagamenti, segreti)
            e coerenza con docs/domain.md. Commenta solo problemi reali.
