name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contogiusto
          POSTGRES_PASSWORD: contogiusto
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contogiusto" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_SERVER: postgresql+psycopg://contogiusto:contogiusto@localhost:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run pytest
      - run: uv run pytest ../scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: I tipi dell'API sono aggiornati
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run test
      - run: npm run build
