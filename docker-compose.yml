# Solo database locale per lo sviluppo; backend e frontend girano con uv / npm.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contogiusto
      POSTGRES_USER: contogiusto
      POSTGRES_PASSWORD: contogiusto
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
